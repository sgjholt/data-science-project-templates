name: test-template

on:
  push:
    branches: [main]
  pull_request:

jobs:
  render-and-test:
    name: ${{ matrix.os }} py${{ matrix.python }} docker=${{ matrix.use_docker }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
        use_docker: ["false"]
        # Docker variant on Linux only: hosted macOS runners have no Docker, and
        # Windows runners only run Windows containers.
        include:
          - { os: ubuntu-latest, python: "3.12", use_docker: "true" }
          - { os: ubuntu-latest, python: "3.13", use_docker: "true" }
          - { os: ubuntu-latest, python: "3.14", use_docker: "true" }
          - { os: ubuntu-latest, python: "3.15", use_docker: "true" }
    defaults:
      run:
        shell: bash  # Git Bash on Windows
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Render template and test generated project
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: scripts/test-template.sh ${{ matrix.use_docker }}
